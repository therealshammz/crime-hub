[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crime-hub"
version = "1.0.0"
description = "Big data analytics platform for Chicago crime data using Hadoop MapReduce, PySpark, and Streamlit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Abhay Raj Kushwaha", email = "abhaykushwaha1729@gmail.com"},
    {name = "Snehal Yadav", email = "snehalyadav935@gmail.com"},
    {name = "Patan Rizwan", email = "Patan.rizwan@sharda.ac.in"}
]
keywords = ["crime-analysis", "big-data", "hadoop", "pyspark", "fastapi", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "streamlit>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "pyspark>=3.5.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/therealshammz/crime-hub"
Documentation = "https://github.com/therealshammz/crime-hub#readme"
Repository = "https://github.com/therealshammz/crime-hub.git"
Issues = "https://github.com/therealshammz/crime-hub/issues"

[project.scripts]
crime-hub-api = "backend.main:main"
crime-hub-dashboard = "dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "pyspark*", "mapreduce*", "visualizations*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=. --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["backend", "pyspark", "mapreduce", "visualizations"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.ci]
# CI-specific settings