name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      
      - name: Run flake8
        run: |
          flake8 mapreduce/ pyspark/ backend/ visualizations/ scripts/ tests/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run black check
        run: |
          black --check mapreduce/ pyspark/ backend/ visualizations/ scripts/ tests/
      
      - name: Run isort check
        run: |
          isort --check-only mapreduce/ pyspark/ backend/ visualizations/ scripts/ tests/